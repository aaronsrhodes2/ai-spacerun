[mod-setting-description]
skippy-copilot-mode=Three steps, from playing by hand to being moved. Advises only: you play, the assistant looks and tells you what it would do. Builds on its own: the assistant places pieces freely while you do your own thing. Moves your character: the assistant walks your character around and builds with its hands and its inventory. You can change this at any time.

skippy-allow-free-placement=On: in 'builds on its own' mode pieces appear without their items once researched. Off: pieces must be carried by your character. The mod enforces this one.
skippy-allow-remote-exploring=On: the map is revealed without anyone walking there. Off: the avatar must go there. The mod enforces this one.
skippy-commander=On: you play from the map (remote view) and place ghosts; your character rides a spidertron that the assistant drives, and its robots build what you place. Off: you play as your character.
skippy-ai-url=Where the assistant's AI runs, as an Ollama address such as localhost:11434 or http://192.168.1.20:11434. The Skippy bridge on your computer reads it and connects by itself, within a minute of a change. Leave empty to use the bridge's own setting.
skippy-ai-model=The Ollama model to use at that address, such as qwen3:8b.
skippy-allow-commander-kit=On: a spider commander whose force has no spidertron gets one, once, with roboports, power, shields, construction robots and a basic building kit. Off: the force must build its own spidertron first. The mod enforces this one.
skippy-allow-ghost-requests=On: the mod turns the shortfall of ghosts into requests (landing pad or requester chest). Off: you request the goods yourself. The mod enforces this one.
skippy-allow-free-fuel=On: a new machine's first fuel is free. Off: fuel is carried to it. The assistant is told; the mod cannot stop it.
skippy-allow-free-upgrades=On: researched quality upgrades are applied to everything at once for free. Off: quality only from modules. An operator script does this and should check this switch.
skippy-allow-player-boosts=On: free crafting, 50 times hand speed, 200 tiles of reach and 200 extra slots for the player. Off: vanilla values. An operator script does this and should check this switch.
skippy-allow-infinite-scrap=On: Fulgora's charted scrap is set to the largest amount. Off: it runs out. An operator script does this and should check this switch.
skippy-allow-unlimited-wire-reach=On: wires may be connected over any distance. Off: only within the wire distance the game gives. An operator script does this and should check this switch.
skippy-allow-ring-foundations=On: platform foundation may be laid in a ring. Off: a connected, filled shape. An operator script does this and should check this switch.

