[mod-setting-name]
skippy-copilot-mode=How the assistant works

[mod-setting-description]
skippy-copilot-mode=Three steps, from playing by hand to being moved. Advises only: you play, the assistant looks and tells you what it would do. Builds on its own: the assistant places pieces freely while you do your own thing. Moves your character: the assistant walks your character around and builds with its hands and its inventory. You can change this at any time.

[string-mod-setting]
skippy-copilot-mode-advise=Advises only
skippy-copilot-mode-free-hand=Builds on its own
skippy-copilot-mode-my-character=Moves your character
